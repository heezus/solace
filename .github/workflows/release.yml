name: Desktop builds

# Builds a single-file Windows .exe and a universal macOS .app of the game, both exported from Jon's Mac (the self-hosted runner). Pull requests only prove the export works; a push to
# main also publishes it as the rolling "latest" release, so one stable link always has the newest build, and installs the new Mac
# app into ~/Applications on this Mac so it opens without a download or a Gatekeeper warning.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths:
      - export_presets.cfg
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, solace-mac]
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Tool path
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Install Godot and its export templates (once per machine)
        run: tests/tools/setup_godot.sh templates

      - name: Import project
        run: tests/tools/import_project.sh

      # The bots that make the later stage starts take minutes, so they run here once and both builds ship the result
      # (stage_starts/ is not in the repo; the game falls back to building a start on demand without it).
      # The build says which one it is on the title screen and the pause menu (scripts/build_info.gd keeps "dev" in the repo).
      - name: Stamp the build
        run: |
          sed -i.bak -e "s/^const DATE := .*/const DATE := \"$(date -u +%Y-%m-%d)\"/" -e "s/^const COMMIT := .*/const COMMIT := \"$(git rev-parse --short=7 HEAD)\"/" scripts/build_info.gd
          rm scripts/build_info.gd.bak
          grep "^const " scripts/build_info.gd

      - name: Bake the stage starts
        run: |
          ./godot --headless --path . -s tests/tools/bake_starts.gd
          ls -l stage_starts

      - name: Export Windows build
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Windows Desktop" build/Solace.exe
          test -s build/Solace.exe
          ls -l build

      - name: Zip it
        run: |
          cd build
          zip -q Solace-windows.zip Solace.exe
          ls -l

      - name: Export macOS build (universal, ad-hoc signed)
        run: |
          ./godot --headless --path . --export-release "macOS" build/Solace-macos.zip
          test -s build/Solace-macos.zip
          unzip -l build/Solace-macos.zip | grep -q "Solace.app/Contents/MacOS/"
          ls -l build

      - uses: actions/upload-artifact@v4
        with:
          name: Solace-builds
          path: |
            build/Solace-windows.zip
            build/Solace-macos.zip

      - name: Publish the rolling latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { echo "::error::gh is not installed on the runner (brew install gh)"; exit 1; }
          short="${GITHUB_SHA::7}"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/Solace-windows.zip build/Solace-macos.zip \
            --target "$GITHUB_SHA" \
            --title "Solace, newest build ($short)" \
            --notes "Builds of main at $short. Windows: unzip Solace-windows.zip, double-click Solace.exe (if Windows warns, click More info, then Run anyway). Mac: unzip Solace-macos.zip, then right-click Solace.app and choose Open (or run xattr -dr com.apple.quarantine Solace.app in Terminal first)."

      # The runner is Jon's own Mac: put the fresh app where he opens it, with the download quarantine flag off. A failure here
      # never fails the build (the release above is the real output).
      - name: Install the Mac app into ~/Applications
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          rm -rf build/install && mkdir -p build/install ~/Applications
          ditto -x -k build/Solace-macos.zip build/install
          test -d build/install/Solace.app
          xattr -dr com.apple.quarantine build/install/Solace.app || true
          rm -rf ~/Applications/Solace.app
          ditto build/install/Solace.app ~/Applications/Solace.app
          echo "Installed $(ls -d ~/Applications/Solace.app) from ${GITHUB_SHA::7}"
