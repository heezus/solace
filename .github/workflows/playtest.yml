name: Playtest

# Not part of CI. A first-time-player pass under a virtual display, with screenshots and the full log kept
# as artifacts. Run it from the Actions tab (or push to the playtest-newbie branch).
on:
  workflow_dispatch:
  push:
    branches: [playtest-newbie]

permissions:
  contents: write

jobs:
  newbie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
      NEWBIE_OUT: ${{ github.workspace }}/newbie-out
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Newcomer pass (recorded)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb ffmpeg
          mkdir -p "$NEWBIE_OUT"
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          export DISPLAY=:99
          ffmpeg -loglevel error -f x11grab -framerate 10 -video_size 1280x800 -i :99 \
            -vf scale=960:-2 -c:v libx264 -preset veryfast -crf 31 -pix_fmt yuv420p "$NEWBIE_OUT/playtest.mp4" &
          FF=$!
          timeout 500 ./godot --rendering-driver opengl3 --audio-driver Dummy --path . -s tests/tools/newbie_pass.gd 2>&1 | tee "$NEWBIE_OUT/godot-output.txt"
          kill -INT $FF; wait $FF || true
          ls -la "$NEWBIE_OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newbie-pass
          path: newbie-out
      - name: Publish screenshots to the playtest-shots branch
        if: always()
        run: |
          dir="$RUNNER_TEMP/shots"
          mkdir -p "$dir/run-${{ github.run_number }}"
          cp newbie-out/* "$dir/run-${{ github.run_number }}/" || true
          cd "$dir"
          git init -q
          git checkout -q -b playtest-shots
          git config user.name "playtest"
          git config user.email "playtest@users.noreply.github.com"
          git add -A
          git commit -qm "Playtest run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" playtest-shots
