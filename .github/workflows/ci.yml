name: CI

# A push or pull request that only touches docs or Markdown skips the run (the mailbox PR, design pages, art notes).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Lint GDScript
        run: |
          pip install "gdtoolkit==4.*"
          gdlint scripts tests
          gdformat -l 120 --check scripts tests

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          ./godot --version

      # Every Godot step fails on any ERROR, SCRIPT ERROR, WARNING or Parse Error line, not only on a
      # failed assertion (tests/tools/run_checked.sh).
      - name: Import project
        run: tests/tools/run_checked.sh ./godot --headless --path . --import

      - name: No new .uid or .import files after import
        run: |
          git status --porcelain
          test -z "$(git status --porcelain -- '*.uid' '*.import')"

      - name: No GDScript warnings the editor would show
        run: tests/tools/check_warnings.sh ./godot

      - name: Check the main scene loads
        run: tests/tools/run_checked.sh ./godot --headless --path . --quit-after 120

      - name: Run logic tests
        run: tests/tools/run_checked.sh ./godot --headless --path . -s tests/run_tests.gd

      - name: Play the main scene with input, to Bronze Dawn
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          tests/tools/run_checked.sh xvfb-run -a -s "-screen 0 1280x800x24" \
            ./godot --rendering-driver opengl3 --audio-driver Dummy --path . -s tests/tools/play_pass.gd

      - name: Map scale holds steady over a long run (changes only with the window)
        run: |
          tests/tools/run_checked.sh xvfb-run -a -s "-screen 0 1280x800x24" \
            ./godot --rendering-driver opengl3 --audio-driver Dummy --path . -s tests/tools/layout_pass.gd
