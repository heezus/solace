name: CI

# A push or pull request that only touches docs or Markdown skips the run (the mailbox PR, design pages, art notes).
on:
  # Manual runs, for when a push event goes missing (it happens after a GitHub error).
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Jon's Mac, registered as a self-hosted runner (docs/RUNNER.md), so no paid minutes are used.
    runs-on: [self-hosted, solace-mac]
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Tool path
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Lint GDScript
        run: |
          venv="$HOME/.cache/solace/venv"
          if [ ! -x "$venv/bin/gdlint" ]; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install -q "gdtoolkit==4.*"
          fi
          "$venv/bin/gdlint" scripts tests
          "$venv/bin/gdformat" -l 120 --check scripts tests

      - name: Install Godot (once per machine)
        run: tests/tools/setup_godot.sh

      # Every Godot step fails on any ERROR, SCRIPT ERROR, WARNING or Parse Error line, not only on a
      # failed assertion (tests/tools/run_checked.sh).
      - name: Import project
        run: tests/tools/import_project.sh

      - name: No new .uid or .import files after import
        run: |
          git status --porcelain
          test -z "$(git status --porcelain -- '*.uid' '*.import')"

      - name: No GDScript warnings the editor would show
        run: tests/tools/check_warnings.sh ./godot

      - name: Check the main scene loads
        run: tests/tools/run_checked.sh ./godot --headless --path . --quit-after 120

      - name: Run logic tests
        run: tests/tools/run_checked.sh ./godot --headless --path . -s tests/run_tests.gd

      - name: Play the main scene with input, to Bronze Dawn
        run: |
          tests/tools/run_checked.sh ./godot --headless --fixed-fps 60 --path . -s tests/tools/play_pass.gd

      - name: Map scale holds steady over a long run (changes only with the window)
        run: |
          tests/tools/run_checked.sh ./godot --headless --fixed-fps 60 --path . -s tests/tools/layout_pass.gd

      - name: Title screen, zoom, pause menu, Save and Load work as a player drives them
        run: |
          tests/tools/run_checked.sh ./godot --headless --fixed-fps 60 --path . -s tests/tools/menu_pass.gd

      - name: The people are Kin on screen once the first ship is read, and the game closes cleanly
        run: |
          tests/tools/run_checked.sh ./godot --headless --fixed-fps 60 --path . -s tests/tools/kin_pass.gd

      - name: Play log and its era-end question card
        run: |
          tests/tools/run_checked.sh ./godot --headless --fixed-fps 60 --path . -s tests/tools/play_log_pass.gd
